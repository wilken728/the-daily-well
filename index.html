const entries=[
{cat:'Personal Growth',title:'Small Steps Build a Different Future',thinker:'James Clear',book:'Atomic Habits',idea:'The habits we repeat can shape our future more than occasional bursts of effort.',explain:'Choose a small behavior that is easy to repeat. Tie it to a routine you already have, and measure consistency before intensity.',example:'After making your morning coffee, read one page and write one sentence about it.',verse:'Galatians 6:9',reflection:'Which two-minute habit would make my life better if I practiced it daily?',challenge:'Do that habit once today.'},
{cat:'Psychology',title:'Why Do I Take Things Personally?',thinker:'Cognitive psychology',book:'Attribution and interpretation',idea:'Our first interpretation of another person’s actions is not always the most accurate.',explain:'People often fill gaps in information with assumptions. Consider alternative explanations before treating an assumption as fact.',example:'A friend does not return your call. They might be busy, distracted, or dealing with a difficult day.',verse:'James 1:19',reflection:'Am I reacting to what happened or to what I assumed it meant?',challenge:'Before reacting, name two other possible explanations.'},
{cat:'Psychology',title:'Name the Feeling Before Acting',thinker:'Emotion regulation research',book:'Affect labeling',idea:'Putting emotions into words can help create space between a feeling and a reaction.',explain:'Instead of saying “I am angry,” try “I notice I am feeling angry.” That subtle shift can support reflection rather than impulsive action.',example:'During a tense conversation, silently identify the feeling before responding.',verse:'Proverbs 15:1',reflection:'What emotion have I been avoiding naming?',challenge:'Pause and label one strong feeling today.'},
{cat:'Faith',title:'Wisdom Requires Examination',thinker:'The Bereans',book:'Acts 17',idea:'An inspiring claim still deserves careful examination.',explain:'The Bereans listened eagerly and examined Scripture. Curiosity and discernment can work together.',example:'When hearing a memorable quote, verify its source and evaluate its meaning.',verse:'Acts 17:11',reflection:'What belief should I examine more carefully?',challenge:'Read the surrounding verses of one passage you hear quoted.'},
{cat:'Leadership',title:'Leadership Is an Act of Service',thinker:'Robert K. Greenleaf',book:'Servant Leadership',idea:'Effective leadership can be measured partly by whether others grow.',explain:'Servant leadership places the needs and development of people ahead of status and control.',example:'Ask a team member what support would help them succeed.',verse:'Mark 10:43–45',reflection:'Who is becoming stronger because of my leadership?',challenge:'Encourage one person without expecting recognition.'},
{cat:'Relationships',title:'Listen to Understand',thinker:'Stephen R. Covey',book:'The 7 Habits of Highly Effective People',idea:'Listening for understanding often changes the quality of a conversation.',explain:'Instead of preparing your response while another person speaks, try summarizing what you heard and asking whether you understood correctly.',example:'Say: “What I hear you saying is… Did I get that right?”',verse:'James 1:19',reflection:'Who needs more of my attention and less of my advice?',challenge:'Have one conversation without interrupting.'},
{cat:'Philosophy',title:'Focus on What You Can Influence',thinker:'Epictetus',book:'Enchiridion',idea:'Peace of mind can improve when we distinguish our choices from outcomes we cannot control.',explain:'Stoic philosophy emphasizes attention to our judgments and actions. This is a philosophical idea, not a substitute for faith or professional care.',example:'You cannot control another person’s reaction, but you can choose your tone and honesty.',verse:'Romans 12:18',reflection:'What am I trying to control that is outside my responsibility?',challenge:'Redirect energy toward one action you can take.'},
{cat:'Business',title:'Make the Next Step Clear',thinker:'Peter Drucker',book:'Management principles',idea:'Good intentions become useful when translated into concrete action.',explain:'A clear next step includes an owner, a deadline, and a measurable outcome.',example:'Replace “improve follow-up” with “contact three customers by Thursday.”',verse:'Proverbs 21:5',reflection:'Which goal is waiting for a specific next step?',challenge:'Write one measurable action and complete it.'},
{cat:'History',title:'Courage Can Begin with One Decision',thinker:'Rosa Parks',book:'Civil rights history',idea:'Lasting change often grows from sustained courage and collective organizing.',explain:'Rosa Parks’ action was part of years of civil rights work and community organization. History reminds us not to separate a defining moment from the people and preparation behind it.',example:'Recognize the quiet work that makes visible breakthroughs possible.',verse:'Micah 6:8',reflection:'What right action have I been postponing?',challenge:'Take one principled step today.'},
{cat:'Science',title:'Curiosity Makes Learning Stronger',thinker:'Scientific inquiry',book:'Learning and experimentation',idea:'Questions and testing help us improve our understanding.',explain:'An observation is not automatically an explanation. Look for evidence, consider alternatives, and update your beliefs when better information appears.',example:'Rather than assuming a new routine works, track a relevant outcome for a few weeks.',verse:'Proverbs 18:13',reflection:'Where would evidence help me replace a guess?',challenge:'Write down one question and how you could investigate it.'}

const extras=[
['Psychology','The Pause Between Feeling and Action','Viktor Frankl','Man’s Search for Meaning','A moment of reflection can help us choose how to respond.','Frankl emphasized human meaning and responsibility under extreme circumstances. A pause is useful, though it does not guarantee control over every emotion.','When irritated by an unexpected comment, breathe and ask what response matches your values.','Proverbs 16:32','What response would reflect the person I want to become?','Practice a thoughtful pause before one difficult reply.'],
['Psychology','The Stories We Tell Ourselves','Aaron T. Beck','Cognitive therapy','Thoughts influence feelings, but thoughts are not always facts.','Cognitive approaches encourage examining evidence and considering more balanced interpretations.','Replace “I always fail” with “This attempt did not work; what can I learn?”','Romans 12:2','Which automatic thought deserves a closer look?','Write down one thought and the evidence for and against it.'],
['Psychology','How Habits Find Their Cues','Behavioral psychology','Habit formation','A repeated context can make a behavior feel automatic.','Changing cues and making desired behaviors easier can support consistency.','Keep your journal beside your morning coffee rather than in a drawer.','1 Corinthians 9:25','What environment is encouraging my current habits?','Adjust one cue in your environment.'],
['Psychology','Why We Notice What Confirms Us','Peter Wason','Confirmation bias','We tend to favor information that supports what we already believe.','A good question is not only “Why am I right?” but “What evidence might change my mind?”','Before sharing a headline, check an independent source with a different perspective.','Proverbs 18:17','Where might I be hearing only one side?','Seek one credible alternative perspective.'],
['Psychology','Compassion Without Losing Boundaries','Kristin Neff','Self-compassion research','Kindness toward yourself can coexist with accountability.','Self-compassion is not an excuse to avoid responsibility; it can help people respond to setbacks constructively.','After a mistake, identify the lesson without calling yourself worthless.','Lamentations 3:22–23','Can I correct myself without condemning myself?','Name one lesson and one next step.'],
['Faith','The Wisdom of Waiting','Biblical wisdom literature','Psalm 27','Waiting can be an active practice of trust and preparation.','Biblical patience does not require ignoring responsibilities; it can include doing the next faithful thing.','Prepare carefully while awaiting an answer to a difficult decision.','Psalm 27:14','Where am I confusing waiting with doing nothing?','Take one responsible step while you wait.'],
['Faith','Practice What You Hear','James','Epistle of James','Insight matters most when it changes conduct.','James challenges readers not to stop at listening; application is part of faithful living.','Turn a lesson on generosity into a concrete act of help.','James 1:22','What truth have I learned but not practiced?','Apply one teaching today.'],
['Personal Growth','Progress Without Perfection','Carol Dweck','Mindset','Abilities and strategies can develop through effort, feedback, and support.','A growth mindset is not a promise that effort alone fixes every obstacle. It invites learning and adaptation.','Ask “What should I try differently?” after a setback.','Philippians 3:13–14','Where has fear of imperfection stopped me?','Try one small improvement.'],
['Personal Growth','Protect Your Attention','Cal Newport','Deep Work','Focused time creates room for meaningful thought.','Reducing interruptions can improve the quality of concentrated work.','Silence notifications during a fifteen-minute reading period.','Ephesians 5:15–16','What distracts me from what matters most?','Protect one uninterrupted block of time.'],
['Leadership','Start with Why','Simon Sinek','Start with Why','Purpose helps explain why a goal deserves commitment.','Clear purpose can guide priorities and communication, but it must be paired with responsible action.','Explain the reason for a volunteer project before discussing assignments.','Habakkuk 2:2','Can the people I lead explain our purpose?','Write one sentence describing the why behind a project.'],
['Leadership','Ask Better Questions','Edgar H. Schein','Humble Inquiry','Curious questions can create trust where quick assumptions create distance.','Asking sincerely can reveal context a leader does not yet understand.','Ask “What am I missing?” in a planning meeting.','Proverbs 20:5','Am I making room for others to teach me?','Ask one open-ended question and listen.'],
['Relationships','Repair Matters More Than Winning','John Gottman','Relationship research','Healthy relationships depend in part on how people repair tension.','Apologies, listening, and gentle efforts to reconnect can interrupt escalating conflict.','Say “I spoke too sharply; can we start again?”','Ephesians 4:32','Is there a relationship that needs a repair attempt?','Offer one sincere repair without demanding an instant response.'],
['Relationships','Give the Generous Interpretation','Brené Brown','Leadership and vulnerability writing','Curiosity can prevent unnecessary assumptions about another person.','A generous interpretation is a starting point, not a reason to ignore harmful patterns or avoid boundaries.','Ask a loved one what happened before assuming bad intent.','1 Corinthians 13:7','Where do I need both generosity and discernment?','Replace one accusation with a respectful question.'],
['Philosophy','An Examined Life','Socrates','Classical philosophy','Careful questions can reveal hidden assumptions.','Socratic questioning asks us to define terms, inspect reasons, and acknowledge uncertainty.','Ask what you really mean when you say a day was “successful.”','1 Thessalonians 5:21','Which important word do I use without defining it?','Write three questions about a belief you hold.'],
['Philosophy','What Makes a Good Life?','Aristotle','Nicomachean Ethics','Character is shaped by repeated choices and practices.','Aristotle connected flourishing with cultivated virtues. Biblical faith brings its own account of virtue and grace.','Practice patience in a small ordinary inconvenience.','2 Peter 1:5–7','Which virtue needs daily practice?','Choose one virtue and one concrete practice.'],
['Business','The Value of a Clear Promise','Seth Godin','This Is Marketing','Trust grows when people understand whom you serve and how you help.','Effective communication begins with a specific audience and a genuine problem, not louder promotion.','Describe a service in one plain sentence a customer can repeat.','Proverbs 11:1','Is my promise clear and truthful?','Rewrite one offer in simple, honest language.'],
['Business','Measure What Matters','John Doerr','Measure What Matters','A small number of meaningful measures can clarify progress.','Goals are more useful when linked to observable results rather than activity alone.','Track meaningful follow-up conversations, not just messages sent.','Luke 14:28','What result would show real progress?','Pick one outcome to review weekly.'],
['History','The Long Work of Justice','Martin Luther King Jr.','Civil rights history','Public breakthroughs often depend on patient collective action.','The civil rights movement combined moral vision, organizing, sacrifice, and sustained work across communities.','Support a local effort consistently rather than only reacting to headlines.','Amos 5:24','Where is steady courage needed today?','Choose one responsible act of service.'],
['History','Learning from the Past Without Simplifying It','Historical inquiry','Historical method','Historical events rarely have only one cause.','Examine primary sources, timelines, and perspectives before drawing easy lessons from the past.','Read an original speech alongside a modern summary.','Proverbs 18:15','What historical story have I accepted too quickly?','Look up one primary source.'],
['Science','Sleep Supports Learning','Sleep research','Memory consolidation','Sleep contributes to learning, memory, and emotional functioning.','Healthy sleep is one part of well-being; persistent sleep difficulties deserve individualized attention.','Give yourself a consistent wind-down routine before bed.','Psalm 4:8','What habit might help me protect rest?','Create a simple evening wind-down cue.']

entries.push({cat:'Behind the Scripture',title:'Matthew 16:18 — This Rock and the Gates of Hades',thinker:'Matthew 16:13–21',book:'Historical and biblical context',idea:'Jesus promises to build his people, and the power of death will not ultimately prevail.',explain:'Jesus speaks in the district of Caesarea Philippi, an area associated with pagan worship and the sanctuary of Pan. Peter has confessed Jesus as the Messiah and Son of the living God (Matthew 16:16). The words Petros (Peter) and petra (rock) form a wordplay. Christians differ on whether the rock emphasizes Peter, his confession, or Peter confessing Christ. Hades denotes the realm of the dead; city gates could symbolize power or confinement. It is not certain that Jesus was pointing to the local cave.',example:'Read Matthew 16:13–21 as one conversation: confession, promise, and Jesus’ prediction of his death and resurrection.',verse:'Matthew 16:18 (KJV)',reflection:'What changes when I trust Jesus to build what belongs to him?',challenge:'Read Matthew 16:13–21 and compare Matthew 16:18 with verse 21.',background:{passage:'And I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it. — Matthew 16:18 (KJV)',setting:'Jesus and the disciples were in the district of Caesarea Philippi near Mount Hermon (Matthew 16:13). The region included a sanctuary of Pan and other pagan worship traditions.',words:'Petros is Peter’s Greek name; petra means rock. Hades refers to the realm of the dead. The KJV translates it “hell,” but the imagery is more directly connected to death and its power.',audience:'Peter has just confessed Jesus as the Christ, the Son of the living God. Jesus responds with a promise about what he will build.',interpretation:'Roman Catholic teaching highlights Peter and his foundational role; many Protestant readings emphasize his confession. Other scholars see Peter and his confession together. The passage alone does not settle every later debate about church authority.',caution:'The local cave is sometimes called the “gates of Hades” in popular teaching. The historical setting is relevant, but we cannot demonstrate that Jesus identified that cave as the referent.',application:'Jesus is the builder; the power of death will not have the last word. This is not a promise of a life without hardship.'}});

entries.push(...[{"cat":"Psychology","title":"The Straw Man Fallacy","thinker":"Critical thinking","book":"Informal logic","idea":"A straw man replaces someone’s actual position with an easier version to attack.","explain":"A person says, “We should review the budget.” Someone replies, “So you want to stop every ministry program?” The reply distorts the proposal.","example":"At a family meeting, repeat the concern fairly before disagreeing: “You want us to review costs, not cancel everything. Is that right?”","verse":"James 1:19","reflection":"Where have I answered a version of someone’s words they never said?","challenge":"Repeat the other person’s point accurately before responding."},{"cat":"Psychology","title":"The Spotlight Effect","thinker":"Social psychology","book":"Attention and self-consciousness","idea":"We often overestimate how closely others notice our small mistakes.","explain":"A forgotten word during a presentation may feel unforgettable to you while listeners remember the main message.","example":"When embarrassed, ask what evidence you have that others are still thinking about it.","verse":"Proverbs 29:25","reflection":"Where am I allowing imagined judgment to control my choices?","challenge":"Take one healthy action without waiting to feel perfectly confident."},{"cat":"Psychology","title":"Confirmation Bias","thinker":"Cognitive psychology","book":"Judgment and evidence","idea":"We tend to notice evidence that agrees with what we already believe.","explain":"If you expect a coworker to be difficult, you may remember every tense moment and overlook their cooperation.","example":"Ask what evidence would cause you to revise your conclusion.","verse":"Proverbs 18:17","reflection":"Whose story have I stopped investigating because I think I know the answer?","challenge":"Look for one credible piece of contrary evidence."},{"cat":"Psychology","title":"The Fundamental Attribution Error","thinker":"Social psychology","book":"Explaining behavior","idea":"We often explain others’ behavior by character while explaining our own by circumstances.","explain":"A driver cuts you off and seems rude; when you rush, you think about your emergency.","example":"Hold open the possibility that another person has pressures you cannot see.","verse":"Matthew 7:3–5","reflection":"Am I granting myself context that I deny to others?","challenge":"Ask one curious question before assigning a motive."},{"cat":"Behind the Scripture","title":"The Good Samaritan — Who Is My Neighbor?","thinker":"Luke 10:25–37","book":"First-century Judea","idea":"Jesus tells a story that challenges narrow definitions of neighborly love.","explain":"The lawyer asks whom he must count as a neighbor. Jesus shifts attention toward becoming a neighbor through mercy.","example":"Samaritans and Jews had longstanding religious and social tensions; the unexpected helper makes the lesson sharper.","verse":"Luke 10:36–37","reflection":"Whose need do I overlook because of differences between us?","challenge":"Offer practical help across a familiar boundary."},{"cat":"Behind the Scripture","title":"The Woman at the Well — More Than a Conversation","thinker":"John 4:1–42","book":"Samaritan context","idea":"Jesus crosses social boundaries and speaks of living water.","explain":"The setting at Jacob’s well highlights shared ancestral history alongside conflict over worship and identity.","example":"Avoid claiming the woman came at noon because she was universally shunned; the passage does not state that motive.","verse":"John 4:7–26","reflection":"What assumptions do I bring to people before hearing their stories?","challenge":"Read the whole conversation and notice who asks the questions."},{"cat":"Behind the Scripture","title":"Bread of Life — Remembering the Wilderness","thinker":"John 6:25–59","book":"Exodus background","idea":"Jesus uses bread imagery in conversation with a crowd familiar with manna.","explain":"The crowd recalls bread from heaven in the wilderness; Jesus redirects attention from temporary provision to himself.","example":"Read John 6 with Exodus 16; notice both the parallels and the differences.","verse":"John 6:35","reflection":"Am I seeking only immediate relief, or also lasting nourishment?","challenge":"Compare John 6:31–35 with Exodus 16."},{"cat":"Behind the Scripture","title":"Salt and Light — Public Faithfulness","thinker":"Matthew 5:13–16","book":"Sermon on the Mount","idea":"Jesus calls his disciples to visible lives that direct praise toward God.","explain":"Salt had multiple ancient uses, including seasoning and preservation; avoid reducing the image to one speculative custom.","example":"The surrounding Beatitudes describe the kind of character that accompanies this witness.","verse":"Matthew 5:16","reflection":"Does the way I treat people make God’s goodness more visible?","challenge":"Practice one quiet act of visible goodness without seeking credit."},{"cat":"Faith","title":"Faith and Honest Questions","thinker":"The Gospel of Mark","book":"Mark 9:14–29","idea":"Faith can include an honest admission of uncertainty.","explain":"A father asks Jesus for help and acknowledges the struggle within his belief.","example":"The passage is not permission to avoid trust; it is an invitation to bring weakness honestly to Jesus.","verse":"Mark 9:24","reflection":"What question have I been afraid to bring to God?","challenge":"Write a sincere prayer that includes both faith and uncertainty."},{"cat":"Faith","title":"The Discipline of Remembering","thinker":"Biblical memory","book":"Psalm 77","idea":"Remembering God’s works can help reorient a troubled heart.","explain":"The psalmist moves through distress and deliberately recalls earlier acts of deliverance.","example":"Remembering is not denying present pain; it is placing pain within a larger story.","verse":"Psalm 77:11–12","reflection":"What past provision have I stopped noticing?","challenge":"Write down one specific moment of gratitude."},{"cat":"Faith","title":"Prayer Without Performance","thinker":"Jesus’ teaching","book":"Matthew 6","idea":"Prayer is communion with God, not a display for an audience.","explain":"In the Sermon on the Mount, Jesus contrasts sincere prayer with practices designed to win attention.","example":"The point is not that public prayer is always wrong, but that motive matters.","verse":"Matthew 6:5–8","reflection":"When do I confuse spiritual appearance with spiritual honesty?","challenge":"Pray privately without trying to impress anyone."},{"cat":"Faith","title":"The Courage to Wait","thinker":"Biblical wisdom","book":"Psalm 27","idea":"Waiting can be an active expression of courage and trust.","explain":"The psalm moves between confidence, petition, and a call to wait for the Lord.","example":"Waiting does not eliminate responsible action; it changes the posture of the heart.","verse":"Psalm 27:14","reflection":"What am I trying to force before its time?","challenge":"Take one faithful step and release the timetable."},{"cat":"Personal Growth","title":"Make the Good Choice Easier","thinker":"Behavior design","book":"Environment and habits","idea":"Our surroundings can make desired habits easier or harder to repeat.","explain":"Putting a book beside your chair removes a small obstacle to reading.","example":"Design the environment before relying only on motivation.","verse":"Proverbs 14:23","reflection":"What small obstacle keeps defeating my good intentions?","challenge":"Remove one obstacle today."},{"cat":"Personal Growth","title":"Reflect Before You React","thinker":"Self-regulation","book":"Pause practices","idea":"A short pause can create room for a deliberate response.","explain":"When an upsetting message arrives, you can wait, breathe, and reread it before replying.","example":"A pause is not avoidance; it is a chance to choose a response aligned with your values.","verse":"Proverbs 15:28","reflection":"Where would a pause protect a relationship?","challenge":"Wait one minute before replying to a difficult message."},{"cat":"Personal Growth","title":"Measure Progress Kindly","thinker":"Learning science","book":"Feedback loops","idea":"Useful feedback describes what happened and what to try next.","explain":"Instead of calling a missed day a failure, ask what made the routine difficult.","example":"Review the process rather than attacking your identity.","verse":"Philippians 3:13–14","reflection":"What lesson can I take from a recent setback?","challenge":"Write one adjustment for tomorrow."},{"cat":"Personal Growth","title":"Protect the First Five Minutes","thinker":"Attention management","book":"Morning routines","idea":"The opening moments of a routine can shape what follows.","explain":"Opening a book before notifications helps protect a period of quiet attention.","example":"Small boundaries create space for what matters most.","verse":"Psalm 5:3","reflection":"What receives my attention before I choose it?","challenge":"Give your first five quiet minutes to reflection."},{"cat":"Leadership","title":"Ask Before You Advise","thinker":"Coaching leadership","book":"Listening and questions","idea":"Good questions often reveal needs that quick advice misses.","explain":"A volunteer who seems disengaged may be confused, overextended, or discouraged.","example":"Ask what support would help before assuming a motivation problem.","verse":"Proverbs 20:5","reflection":"Whose situation have I diagnosed without asking?","challenge":"Ask a sincere question and listen to the whole answer."},{"cat":"Leadership","title":"Clarity Is Kindness","thinker":"Team communication","book":"Expectations","idea":"People serve more confidently when expectations are clear.","explain":"“Please handle the event” is vague; a written checklist of responsibilities reduces confusion.","example":"Define the outcome, owner, and time frame without micromanaging.","verse":"1 Corinthians 14:40","reflection":"Where have I expected others to read my mind?","challenge":"Clarify one responsibility in writing."},{"cat":"Leadership","title":"Praise the Quiet Contribution","thinker":"Team culture","book":"Recognition","idea":"Recognition can strengthen trust when it notices work that is easy to overlook.","explain":"A person who sets up equipment before anyone arrives may feel invisible.","example":"Be specific about what the contribution made possible.","verse":"1 Thessalonians 5:11","reflection":"Who serves faithfully without being noticed?","challenge":"Thank someone for a specific unseen contribution."},{"cat":"Leadership","title":"Delegate for Growth","thinker":"Leadership development","book":"Responsibility","idea":"Delegation can develop people, not merely move tasks off a leader’s plate.","explain":"Let an emerging leader lead part of a meeting with support and feedback.","example":"Match responsibility to readiness and provide a clear path for questions.","verse":"2 Timothy 2:2","reflection":"What responsibility am I holding that could help someone else grow?","challenge":"Invite one person to own a manageable task."},{"cat":"Relationships","title":"Repair Starts with Ownership","thinker":"Conflict resolution","book":"Apologies","idea":"A useful apology names the harm without hiding behind excuses.","explain":"“I interrupted you, and that was disrespectful” is clearer than “I’m sorry you felt hurt.”","example":"Listen to the impact and ask what repair would help.","verse":"Matthew 5:23–24","reflection":"Where do I need to take responsibility without defending myself?","challenge":"Offer one specific apology if appropriate."},{"cat":"Relationships","title":"Curiosity Before Certainty","thinker":"Interpersonal communication","book":"Perspective-taking","idea":"Curiosity can prevent misunderstandings from becoming fixed judgments.","explain":"A short text may sound cold because tone is missing.","example":"Ask what someone meant instead of assuming the worst.","verse":"Proverbs 18:13","reflection":"What relationship needs a clarifying question?","challenge":"Ask for context without accusation."},{"cat":"Relationships","title":"Boundaries and Kindness Can Coexist","thinker":"Healthy relationships","book":"Limits","idea":"A respectful no can protect both honesty and connection.","explain":"Agreeing to every request can lead to resentment and broken commitments.","example":"A boundary explains what you can do, without trying to control another person.","verse":"Matthew 5:37","reflection":"Where does my yes need to become more thoughtful?","challenge":"Give one clear, gracious answer today."},{"cat":"Relationships","title":"Notice the Bid for Connection","thinker":"Relationship research","book":"Everyday attention","idea":"Small requests for attention can be opportunities to strengthen connection.","explain":"A spouse mentions something interesting; turning toward them for a moment communicates care.","example":"You need not respond perfectly to every interruption; aim for attentive presence.","verse":"Romans 12:10","reflection":"Which small invitation to connect have I been missing?","challenge":"Give someone five undistracted minutes."},{"cat":"Philosophy","title":"Examine the Unexamined Assumption","thinker":"Socratic inquiry","book":"Critical questioning","idea":"Asking why we believe something can reveal hidden assumptions.","explain":"“Everyone thinks this” may mean only the few people we hear most often.","example":"Ask what the claim means, what supports it, and what would challenge it.","verse":"Proverbs 18:15","reflection":"What assumption deserves a second look?","challenge":"Write one belief and the evidence behind it."},{"cat":"Philosophy","title":"Choose Your Response","thinker":"Stoic philosophy","book":"Practical judgment","idea":"We cannot choose every event, but we can often choose how to respond.","explain":"An unexpected delay becomes an opportunity to practice patience rather than irritation.","example":"This is a philosophical practice; it does not imply every hardship is controllable.","verse":"Proverbs 16:32","reflection":"What response is still within my control today?","challenge":"Practice patience during one inconvenience."},{"cat":"Philosophy","title":"The Value of a Good Question","thinker":"Philosophy of inquiry","book":"Reasoning","idea":"A better question can be more useful than a rushed answer.","explain":"Instead of “Who is to blame?” ask “What happened, and what can we learn?”","example":"Good questions invite evidence and keep inquiry open.","verse":"James 1:19","reflection":"Which question would improve a difficult conversation?","challenge":"Replace one accusation with a genuine question."},{"cat":"Philosophy","title":"Enough Is Worth Defining","thinker":"Ethics and contentment","book":"Values","idea":"Without a clear sense of enough, achievement can become endless comparison.","explain":"A person reaches a goal and immediately feels behind someone else.","example":"Define what sufficiency looks like in relationships, work, and resources.","verse":"1 Timothy 6:6","reflection":"Where has comparison moved the finish line?","challenge":"Name one area where gratitude can replace comparison."},{"cat":"Business","title":"Start with the Customer’s Problem","thinker":"Business strategy","book":"Customer needs","idea":"Useful services solve a problem someone actually experiences.","explain":"Before designing a new offer, ask potential customers what is difficult today.","example":"Listen for repeated needs rather than only compliments about your idea.","verse":"Proverbs 18:13","reflection":"Whose problem am I assuming I understand?","challenge":"Ask one potential customer a non-leading question."},{"cat":"Business","title":"Know the Difference Between Revenue and Profit","thinker":"Business fundamentals","book":"Financial literacy","idea":"Money received is not the same as money kept after costs.","explain":"A product sold for $40 may leave much less after production, shipping, and fees.","example":"Calculate full costs before setting a price.","verse":"Luke 14:28","reflection":"What expense have I overlooked in a plan?","challenge":"Write out the full cost of one offering."},{"cat":"Business","title":"Build Trust Through Follow-Through","thinker":"Customer relationships","book":"Reliability","idea":"Consistent follow-through can matter more than a dramatic promise.","explain":"A brief update before a deadline reassures a client that the work is moving.","example":"Make commitments you can keep and communicate early when plans change.","verse":"Proverbs 25:14","reflection":"Which promise needs an update from me?","challenge":"Send one timely status message."},{"cat":"Business","title":"Test Small Before Scaling","thinker":"Entrepreneurship","book":"Experiments","idea":"A small pilot can reveal what works before a larger commitment.","explain":"Try a limited offering with a few customers and gather honest feedback.","example":"Decide in advance what success would look like.","verse":"Proverbs 21:5","reflection":"What idea could I test without a major expense?","challenge":"Design one small, measurable pilot."},{"cat":"History","title":"The Montgomery Bus Boycott Was Organized","thinker":"Civil rights history","book":"Montgomery 1955–1956","idea":"The boycott’s impact depended on sustained collective action, not one isolated moment.","explain":"Community networks, carpools, local leaders, and participants sustained the campaign over many months.","example":"Remember the often-unseen planning behind historic change.","verse":"Galatians 6:9","reflection":"What worthwhile effort needs patient organization?","challenge":"Recognize a behind-the-scenes contributor."},{"cat":"History","title":"The Printing Press and the Spread of Ideas","thinker":"History of technology","book":"Early modern Europe","idea":"Changes in how information travels can reshape learning and public debate.","explain":"Movable-type printing helped books and pamphlets circulate more widely in Europe.","example":"Greater access to information also increased the need to evaluate competing claims.","verse":"Proverbs 18:15","reflection":"How do I distinguish access to information from wisdom?","challenge":"Verify the source of one widely shared claim."},{"cat":"History","title":"The Harlem Renaissance Was More Than Literature","thinker":"African American cultural history","book":"1920s–1930s","idea":"Art, music, writing, and public thought helped express complex Black experiences and aspirations.","explain":"The movement involved creators across multiple disciplines and cities, with Harlem as an important center.","example":"Avoid reducing a broad movement to one artist or a single message.","verse":"Psalm 96:1","reflection":"Whose creativity has expanded my understanding of history?","challenge":"Learn about one artist or writer from the period."},{"cat":"History","title":"The Importance of Primary Sources","thinker":"Historical method","book":"Evidence","idea":"Historical understanding improves when we distinguish original records from later interpretations.","explain":"A diary, newspaper report, or speech can show what someone said, but still needs context.","example":"Ask who produced the source, for whom, and for what purpose.","verse":"Proverbs 18:17","reflection":"What historical story have I accepted without examining evidence?","challenge":"Look up one primary source connected to a claim."},{"cat":"Science","title":"Sleep Helps Consolidate Learning","thinker":"Neuroscience","book":"Memory","idea":"Sleep supports processes involved in learning and memory.","explain":"Practicing a skill and getting adequate rest can be more useful than endless late-night repetition.","example":"Sleep needs vary, and persistent sleep problems warrant individualized advice.","verse":"Psalm 4:8","reflection":"What would protecting rest make possible?","challenge":"Set a realistic wind-down cue."},{"cat":"Science","title":"Correlation Is Not Causation","thinker":"Scientific reasoning","book":"Evidence","idea":"Two things changing together does not prove one caused the other.","explain":"Ice cream sales and swimming incidents may both rise in hot weather.","example":"Ask whether a third factor could explain the pattern.","verse":"Proverbs 18:13","reflection":"Where have I confused a pattern with proof?","challenge":"Identify one alternative explanation."},{"cat":"Science","title":"Why Spaced Practice Works","thinker":"Learning science","book":"Memory and review","idea":"Revisiting information over time often supports longer-term recall.","explain":"Reviewing an idea briefly on several days can outperform one long cram session.","example":"Use the archive to revisit an insight after a few days.","verse":"Deuteronomy 6:6–7","reflection":"Which idea deserves repeated reflection?","challenge":"Revisit one saved reading this week."},{"cat":"Science","title":"The Power of a Testable Question","thinker":"Scientific method","book":"Experiments","idea":"A testable question states what you will observe and compare.","explain":"“Does a quiet morning help my focus?” can be explored by tracking focus across days.","example":"One personal observation is useful for reflection but not definitive proof.","verse":"Proverbs 18:15","reflection":"What question could I investigate more carefully?","challenge":"Write a question and a simple way to observe it."}]);

entries.push(...[{"cat":"Psychology","title":"Confirmation Bias — Clear Thinking Day 1","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 1 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"We naturally seek evidence that supports what we already think.","explain":"A leader hears two positive comments and dismisses one thoughtful concern. Agreement feels reassuring, but it is not proof.","example":"Before deciding, ask: What would change my mind? Listen carefully to the strongest contrary evidence.","verse":"Proverbs 18:17","reflection":"Where am I defending a conclusion instead of examining it?","challenge":"Invite a trusted person to challenge one assumption."},{"cat":"Psychology","title":"Social Proof — Clear Thinking Day 2","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 2 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"When uncertain, we often follow what other people are doing.","explain":"A popular post is shared thousands of times. Its popularity tells you that people noticed it, not that its claim is true.","example":"A crowd can be helpful evidence of what is common, but not a substitute for independent judgment.","verse":"Exodus 23:2","reflection":"Where has popularity become my measure of wisdom?","challenge":"Check one popular claim before repeating it."},{"cat":"Psychology","title":"Sunk Cost Fallacy — Clear Thinking Day 3","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 3 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"Past investment can tempt us to continue something that no longer serves its purpose.","explain":"You keep paying for a service because you already spent so much on it. Yesterday’s expense cannot be recovered by spending more tomorrow.","example":"Ask whether you would choose the same path today if you were starting fresh.","verse":"Luke 14:28","reflection":"What am I continuing only because I have already invested in it?","challenge":"Review one commitment using its future value, not past cost."},{"cat":"Psychology","title":"Survivorship Bias — Clear Thinking Day 4","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 4 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"Visible successes can hide the many attempts that did not succeed.","explain":"An entrepreneur tells how dropping out of school led to success. We rarely hear the stories of people who took the same risk and struggled.","example":"Study both the successful cases and the missing cases before drawing a rule.","verse":"Proverbs 18:15","reflection":"Which unheard stories might change my conclusion?","challenge":"Ask what the failures teach, not only the winners."},{"cat":"Psychology","title":"Overconfidence Effect — Clear Thinking Day 5","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 5 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"Confidence in a judgment can exceed the quality of the evidence behind it.","explain":"After hearing one account of a disagreement, you feel certain you know everyone’s motives.","example":"Separate what you know, what you infer, and what you still need to learn.","verse":"Proverbs 11:2","reflection":"Where am I most certain despite limited information?","challenge":"Name one uncertainty before giving advice."},{"cat":"Psychology","title":"Authority Bias — Clear Thinking Day 6","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 6 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"We may give too much weight to a claim because an expert or leader says it.","explain":"A respected speaker endorses a product outside their field of expertise, and listeners assume the claim has been verified.","example":"Respect experience while checking whether the authority has relevant evidence.","verse":"Acts 17:11","reflection":"Am I evaluating the claim or only the reputation of the person making it?","challenge":"Verify one expert claim with a reliable independent source."},{"cat":"Psychology","title":"Outcome Bias — Clear Thinking Day 7","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 7 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"A good result does not automatically mean a decision was wise.","explain":"Someone takes a reckless shortcut and arrives safely. Luck does not turn a dangerous decision into a good one.","example":"Judge the quality of the process using the information available at the time, not only the ending.","verse":"Proverbs 15:22","reflection":"Have I praised or condemned a decision only because of its outcome?","challenge":"Review the reasoning behind one recent decision."},{"cat":"Psychology","title":"Paradox of Choice — Clear Thinking Day 8","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 8 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"More options can sometimes make deciding harder and less satisfying.","explain":"You spend an hour comparing dozens of nearly identical products, then doubt your final choice.","example":"Set a few meaningful criteria, narrow the options, and choose when a good-enough match appears.","verse":"1 Corinthians 14:40","reflection":"Where are endless options keeping me from taking action?","challenge":"Limit one decision to three reasonable choices."},{"cat":"Psychology","title":"Availability Bias — Clear Thinking Day 9","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 9 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"Events that are vivid or easy to remember can seem more common than they are.","explain":"A dramatic news story makes a rare event feel like an everyday danger.","example":"Ask for rates, context, and broader evidence instead of relying on memorable examples.","verse":"Proverbs 18:13","reflection":"Which vivid story has shaped my judgment more than the evidence?","challenge":"Look for base rates before drawing a conclusion."},{"cat":"Psychology","title":"Hindsight Bias — Clear Thinking Day 10","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 10 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"After an event, we may believe we knew all along what would happen.","explain":"After a project fails, everyone says the warning signs were obvious, though the original decision involved uncertainty.","example":"Record predictions before outcomes and revisit what you actually expected.","verse":"James 4:13–15","reflection":"Where have I rewritten my memory to make myself seem more certain?","challenge":"Write down an expectation and why you hold it."},{"cat":"Psychology","title":"Narrative Fallacy — Clear Thinking Day 11","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 11 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"A satisfying story can make complex events seem simpler and more predictable than they are.","explain":"A biography reduces a person’s success to one habit, leaving out opportunity, help, timing, and setbacks.","example":"Stories help us remember, but a coherent explanation is not automatically a complete one.","verse":"Proverbs 18:17","reflection":"What important details might my favorite explanation leave out?","challenge":"List two alternative causes for an event."},{"cat":"Psychology","title":"Loss Aversion — Clear Thinking Day 12","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 12 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"Losing something often feels more painful than gaining an equivalent amount feels good.","explain":"You reject a sensible change because the possibility of losing a familiar benefit feels overwhelming.","example":"Notice the emotional weight of potential loss and compare realistic gains and losses fairly.","verse":"Matthew 6:21","reflection":"What am I protecting so tightly that I cannot evaluate it clearly?","challenge":"Write both sides of a choice in concrete terms."},{"cat":"Psychology","title":"Anchoring Effect — Clear Thinking Day 13","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 13 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"The first number or impression we encounter can pull later judgments toward it.","explain":"A high original price makes a modest discount seem like a bargain, even if the final price is still too high.","example":"Choose your criteria before seeing the seller’s first offer or someone else’s estimate.","verse":"Proverbs 20:14","reflection":"What first impression is controlling my evaluation?","challenge":"Research an independent reference point before deciding."},{"cat":"Psychology","title":"Halo Effect — Clear Thinking Day 14","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 14 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"One appealing quality can cause us to assume other positive qualities without evidence.","explain":"A charismatic communicator seems trustworthy, so listeners assume every claim is accurate.","example":"Evaluate character, competence, and evidence separately rather than letting one strength decide everything.","verse":"1 Samuel 16:7","reflection":"Whose strengths have led me to overlook questions I should ask?","challenge":"Assess one claim independently of the speaker’s charm."},{"cat":"Psychology","title":"Planning Fallacy — Clear Thinking Day 15","thinker":"Cognitive psychology and critical thinking","book":"Clear Thinking · Day 15 of 15 · Inspired by Rolf Dobelli’s The Art of Thinking Clearly","idea":"We often underestimate the time, cost, and obstacles involved in completing a task.","explain":"You expect a new project to take one weekend, forgetting the interruptions and revisions that slowed similar projects.","example":"Look at comparable past projects, add a buffer, and break the work into smaller milestones.","verse":"Luke 14:28–30","reflection":"Where am I confusing enthusiasm with a realistic plan?","challenge":"Add a practical time buffer to one commitment."}]);
const sizeKey='well-reading-scale';let readingScale=Number(localStorage.getItem(sizeKey))||1.18;function applyReadingSize(){readingScale=Math.max(1,Math.min(1.6,readingScale));document.documentElement.style.setProperty('--reading-scale',readingScale);document.getElementById('textSizeStatus').textContent=Math.round(readingScale*100)+'%';localStorage.setItem(sizeKey,String(readingScale));}document.getElementById('smallerText').onclick=()=>{readingScale=Math.round((readingScale-.1)*100)/100;applyReadingSize()};document.getElementById('largerText').onclick=()=>{readingScale=Math.round((readingScale+.1)*100)/100;applyReadingSize()};applyReadingSize();
const cats=['All','Psychology','Behind the Scripture','Faith','Personal Growth','Leadership','Relationships','Philosophy','Business','History','Science'];let current='All',view='today',query='';const $=id=>document.getElementById(id);const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let fav=get('well-favorites',[]),notes=get('well-notes',{});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dayNumber(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function todaysEntries(){const day=dayNumber()-Math.floor(Date.UTC(2026,9,12)/86400000);return cats.filter(c=>c!=='All').map(c=>{const group=entries.map((e,i)=>({...e,i})).filter(e=>e.cat===c);return group.length?group[((day%group.length)+group.length)%group.length]:null}).filter(Boolean)}
const firstSeenKey='well-first-seen-v3';let seen=get(firstSeenKey,{});
function markSeen(arr){let changed=false;for(const e of arr){if(!seen[e.i]){seen[e.i]=new Date().toISOString().slice(0,10);changed=true}}if(changed)put(firstSeenKey,seen)}function render(){ $('categories').innerHTML=cats.map(c=>`<button class="${current===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{current=b.dataset.cat;view='browse';render()});let arr=entries.map((e,i)=>({...e,i}));if(view==='today'){arr=todaysEntries();markSeen(arr);}else if(view==='archive')arr=arr;else if(view==='favorites')arr=arr.filter(e=>fav.includes(e.i));else if(view==='notes')arr=arr.filter(e=>notes[e.i]);else if(current!=='All')arr=arr.filter(e=>e.cat===current);if(query)arr=arr.filter(e=>[e.title,e.cat,e.thinker,e.book,e.idea,e.explain,e.verse].join(' ').toLowerCase().includes(query));$('count').textContent=entries.length+' readings in your library';if(view==='about'){ $('content').innerHTML=`<section class="card"><span class="pill">About The Daily Well</span><h2>Wisdom for everyday life</h2><p>The Daily Well with Pastor Ken & CJ brings together original educational summaries, thoughtful questions, biblical connections, and one practical action at a time.</p><h3>Daily readings and archive</h3><p>Each category displays one reading per day, selected automatically from the current collection. Search “Clear Thinking” in the Reading Archive to find the complete 15-day thinking series. Readings repeat when a category runs out of new material. The Reading Archive keeps all available readings, including older discoveries and new additions. New content requires periodic library updates.</p><h3>Privacy and saved reflections</h3><p>Notes and saved ideas are stored in this browser on this device. They are not synced to another device or backed up automatically. If you clear browser data, they may be lost. Export your journal regularly.</p><div class="actions"><button id="export">Download My Journal</button><button id="print">Print This Page</button></div><p class="hint">Book and thinker references are attributed inspiration, not direct quotations, endorsements, or full book summaries. Biblical connections invite careful reading of Scripture; not every author's ideas are identical to biblical teaching.</p><p>Presented as a prototype for possible UCF outreach. This app can be published as a public website; your journal remains local to your browser.</p></section>`;$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'The Daily Well',version:2,exported:new Date().toISOString(),favorites:fav,notes,readings:entries.map(e=>({title:e.title,category:e.cat}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='The Daily Well Journal.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('print').onclick=()=>window.print();return;}$('content').innerHTML=`<h2>${view==='today'?'Today’s Discoveries — One in Every Category':view==='archive'?'Reading Archive':view==='favorites'?'Saved Ideas':view==='notes'?'My Reflections':current==='All'?'Explore the Library':esc(current)}</h2>${arr.length?'':'<p>No entries here yet. Explore a category and save an idea or reflection.</p>'}<div class="${view==='browse'?'grid':''}">${arr.map(e=>`<article class="card"><div class="eyebrow">${esc(e.cat)}</div><h2>${esc(e.title)}</h2><small>Inspired by ${esc(e.thinker)} · ${esc(e.book)}</small>${e.background?`<h3>Scripture Reading</h3><p>${esc(e.background.passage)}</p><h3>Historical Setting</h3><p>${esc(e.background.setting)}</p><h3>Why These Words?</h3><p>${esc(e.background.words)}</p><h3>What Did the First Hearers Understand?</h3><p>${esc(e.background.audience)}</p><h3>Challenge the Interpretation</h3><p>${esc(e.background.interpretation)}</p><h3>Historical Caution</h3><p>${esc(e.background.caution)}</p><h3>Meaning for Today</h3><p>${esc(e.background.application)}</p>`:`<h3>Big Idea</h3><p>${esc(e.idea)}</p>`}${e.background?'':`<h3>Understand It</h3><p>${esc(e.explain)}</p><h3>Real-Life Example</h3><p>${esc(e.example)}</p><h3>Wisdom Meets the Word</h3><p><strong>${esc(e.verse)}</strong> — Read this passage in your Bible and consider how it relates to the idea.</p>`}<h3>Reflection</h3><p>${esc(e.reflection)}</p><h3>Today's Action</h3><p>${esc(e.challenge)}</p><label for="note${e.i}"><strong>My Notes</strong></label><textarea id="note${e.i}" placeholder="What stood out to me today?">${esc(notes[e.i]||'')}</textarea><div class="actions"><button data-save="${e.i}">Save Reflection</button><button data-fav="${e.i}">${fav.includes(e.i)?'♥ Saved':'♡ Save Idea'}</button></div></article>`).join('')}</div>`;document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let i=+b.dataset.fav;fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];put('well-favorites',fav);render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let i=+b.dataset.save;notes[i]=$('note'+i).value;put('well-notes',notes);b.textContent='Saved ✓';});} $('search').oninput=e=>{query=e.target.value.trim().toLowerCase();view='browse';render()};$('about').onclick=()=>{view='about';render()};$('today').onclick=()=>{view='today';render()};$('archive').onclick=()=>{view='archive';render()};$('favorites').onclick=()=>{view='favorites';render()};$('notes').onclick=()=>{view='notes';render()};$('theme').onclick=()=>{document.body.classList.toggle('dark');put('well-dark',document.body.classList.contains('dark'))};if(get('well-dark',false))document.body.classList.add('dark');render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
