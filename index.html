<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18332e"><title>The Daily Well | Pastor Ken & CJ</title><meta name="description" content="Daily wisdom, psychology, biblical reflection and practical action from The Daily Well."><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#24352e;background:#f7f5ef}*{box-sizing:border-box}body{margin:0}header{background:#18332e;color:#fff;padding:28px max(18px,calc((100vw - 900px)/2));}h1{margin:4px 0;font-family:Georgia,serif;font-size:2.4rem}header p{color:#e7d6a9}main{max-width:900px;margin:auto;padding:20px}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button,select,input{font:inherit;cursor:pointer;border:1px solid #b7c3b9;border-radius:22px;background:white;padding:10px 16px;color:#18332e}button.active{background:#18332e;color:white}.card{background:white;border:1px solid #e3e5de;border-radius:20px;padding:25px;margin:14px 0;box-shadow:0 4px 18px #172d2310}.eyebrow{color:#577264;font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}h2{font-family:Georgia,serif;font-size:1.8rem}h3{font-family:Georgia,serif}p{line-height:1.65}small{color:#607266}.actions{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%;min-height:100px;border:1px solid #bdc7bd;border-radius:12px;padding:12px;font:inherit}footer{text-align:center;padding:30px;color:#607266}.hidden{display:none}body.dark{background:#14221d;color:#edf2e9}body.dark .card{background:#20342b;border-color:#486052}body.dark button{background:#263e32;color:#fff;border-color:#577264}body.dark button.active{background:#e8d39c;color:#182f26}body.dark input,body.dark textarea{background:#14251c;color:#fff}body.dark small{color:#c0d0c5}@media(min-width:650px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}}input[type=search]{width:100%;max-width:460px;border-radius:12px;padding:13px 16px;margin:12px 0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.hint{font-size:.85rem;color:#62766a}.status{font-weight:700;color:#2b7453}.utility{margin-top:20px}.pill{display:inline-block;padding:5px 12px;background:#e8efe6;border-radius:20px;color:#214c3b;font-size:.8rem}body.dark .hint{color:#c4d3c8}body.dark .pill{background:#395747;color:#fff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bb8b34;outline-offset:2px}/* Comfortable reading and user-controlled sizing */

</style></head><body><header><div class="eyebrow" style="color:#e4ce91">PASTOR KEN & CJ</div><h1>The Daily Well</h1><p>Draw wisdom. Deepen faith. Live with purpose.</p></header><main><div class="actions"><button id="today">Today's Reading</button><button id="archive">Reading Archive</button><button id="favorites">Saved Ideas</button><button id="notes">My Reflections</button><button id="theme">☾ Dark Mode</button><button id="about">About & Privacy</button></div><div class="reading-size-controls" aria-label="Reading text size"><span>Reading size</span><button id="smallerText" type="button" aria-label="Decrease reading text size">A−</button><button id="largerText" type="button" aria-label="Increase reading text size">A+</button><span id="textSizeStatus" role="status"></span></div><div class="toolbar"><input id="search" type="search" placeholder="Search wisdom, books, topics…" aria-label="Search readings"><span class="hint" id="count"></span></div><nav id="categories"></nav><div id="content"></div></main><footer>Read • Reflect • Apply — Original educational summaries, not quotations from the books named.</footer><script>
const entries=[
{cat:'Personal Growth',title:'Small Steps Build a Different Future',thinker:'James Clear',book:'Atomic Habits',idea:'The habits we repeat can shape our future more than occasional bursts of effort.',explain:'Choose a small behavior that is easy to repeat. Tie it to a routine you already have, and measure consistency before intensity.',example:'After making your morning coffee, read one page and write one sentence about it.',verse:'Galatians 6:9',reflection:'Which two-minute habit would make my life better if I practiced it daily?',challenge:'Do that habit once today.'},
{cat:'Psychology',title:'Why Do I Take Things Personally?',thinker:'Cognitive psychology',book:'Attribution and interpretation',idea:'Our first interpretation of another person’s actions is not always the most accurate.',explain:'People often fill gaps in information with assumptions. Consider alternative explanations before treating an assumption as fact.',example:'A friend does not return your call. They might be busy, distracted, or dealing with a difficult day.',verse:'James 1:19',reflection:'Am I reacting to what happened or to what I assumed it meant?',challenge:'Before reacting, name two other possible explanations.'},
{cat:'Psychology',title:'Name the Feeling Before Acting',thinker:'Emotion regulation research',book:'Affect labeling',idea:'Putting emotions into words can help create space between a feeling and a reaction.',explain:'Instead of saying “I am angry,” try “I notice I am feeling angry.” That subtle shift can support reflection rather than impulsive action.',example:'During a tense conversation, silently identify the feeling before responding.',verse:'Proverbs 15:1',reflection:'What emotion have I been avoiding naming?',challenge:'Pause and label one strong feeling today.'},
{cat:'Faith',title:'Wisdom Requires Examination',thinker:'The Bereans',book:'Acts 17',idea:'An inspiring claim still deserves careful examination.',explain:'The Bereans listened eagerly and examined Scripture. Curiosity and discernment can work together.',example:'When hearing a memorable quote, verify its source and evaluate its meaning.',verse:'Acts 17:11',reflection:'What belief should I examine more carefully?',challenge:'Read the surrounding verses of one passage you hear quoted.'},
{cat:'Leadership',title:'Leadership Is an Act of Service',thinker:'Robert K. Greenleaf',book:'Servant Leadership',idea:'Effective leadership can be measured partly by whether others grow.',explain:'Servant leadership places the needs and development of people ahead of status and control.',example:'Ask a team member what support would help them succeed.',verse:'Mark 10:43–45',reflection:'Who is becoming stronger because of my leadership?',challenge:'Encourage one person without expecting recognition.'},
{cat:'Relationships',title:'Listen to Understand',thinker:'Stephen R. Covey',book:'The 7 Habits of Highly Effective People',idea:'Listening for understanding often changes the quality of a conversation.',explain:'Instead of preparing your response while another person speaks, try summarizing what you heard and asking whether you understood correctly.',example:'Say: “What I hear you saying is… Did I get that right?”',verse:'James 1:19',reflection:'Who needs more of my attention and less of my advice?',challenge:'Have one conversation without interrupting.'},
{cat:'Philosophy',title:'Focus on What You Can Influence',thinker:'Epictetus',book:'Enchiridion',idea:'Peace of mind can improve when we distinguish our choices from outcomes we cannot control.',explain:'Stoic philosophy emphasizes attention to our judgments and actions. This is a philosophical idea, not a substitute for faith or professional care.',example:'You cannot control another person’s reaction, but you can choose your tone and honesty.',verse:'Romans 12:18',reflection:'What am I trying to control that is outside my responsibility?',challenge:'Redirect energy toward one action you can take.'},

const extras=[
['Psychology','The Pause Between Feeling and Action','Viktor Frankl','Man’s Search for Meaning','A moment of reflection can help us choose how to respond.','Frankl emphasized human meaning and responsibility under extreme circumstances. A pause is useful, though it does not guarantee control over every emotion.','When irritated by an unexpected comment, breathe and ask what response matches your values.','Proverbs 16:32','What response would reflect the person I want to become?','Practice a thoughtful pause before one difficult reply.'],
['Psychology','The Stories We Tell Ourselves','Aaron T. Beck','Cognitive therapy','Thoughts influence feelings, but thoughts are not always facts.','Cognitive approaches encourage examining evidence and considering more balanced interpretations.','Replace “I always fail” with “This attempt did not work; what can I learn?”','Romans 12:2','Which automatic thought deserves a closer look?','Write down one thought and the evidence for and against it.'],
['Psychology','How Habits Find Their Cues','Behavioral psychology','Habit formation','A repeated context can make a behavior feel automatic.','Changing cues and making desired behaviors easier can support consistency.','Keep your journal beside your morning coffee rather than in a drawer.','1 Corinthians 9:25','What environment is encouraging my current habits?','Adjust one cue in your environment.'],
['Psychology','Why We Notice What Confirms Us','Peter Wason','Confirmation bias','We tend to favor information that supports what we already believe.','A good question is not only “Why am I right?” but “What evidence might change my mind?”','Before sharing a headline, check an independent source with a different perspective.','Proverbs 18:17','Where might I be hearing only one side?','Seek one credible alternative perspective.'],

['Faith','Practice What You Hear','James','Epistle of James','Insight matters most when it changes conduct.','James challenges readers not to stop at listening; application is part of faithful living.','Turn a lesson on generosity into a concrete act of help.','James 1:22','What truth have I learned but not practiced?','Apply one teaching today.'],
['Personal Growth','Progress Without Perfection','Carol Dweck','Mindset','Abilities and strategies can develop through effort, feedback, and support.','A growth mindset is not a promise that effort alone fixes every obstacle. It invites learning and adaptation.','Ask “What should I try differently?” after a setback.','Philippians 3:13–14','Where has fear of imperfection stopped me?','Try one small improvement.'],
['Personal Growth','Protect Your Attention','Cal Newport','Deep Work','Focused time creates room for meaningful thought.','Reducing interruptions can improve the quality of concentrated work.','Silence notifications during a fifteen-minute reading period.','Ephesians 5:15–16','What distracts me from what matters most?','Protect one uninterrupted block of time.'],

entries.push({cat:'Behind the Scripture',title:'Matthew 16:18 — This Rock and the Gates of Hades',thinker:'Matthew 16:13–21',book:'Historical and biblical context',idea:'Jesus promises to build his people, and the power of death will not ultimately prevail.',explain:'Jesus speaks in the district of Caesarea Philippi, an area associated with pagan worship and the sanctuary of Pan. Peter has confessed Jesus as the Messiah and Son of the living God (Matthew 16:16). The words Petros (Peter) and petra (rock) form a wordplay. Christians differ on whether the rock emphasizes Peter, his confession, or Peter confessing Christ. Hades denotes the realm of the dead; city gates could symbolize power or confinement. It is not certain that Jesus was pointing to the local cave.',example:'Read Matthew 16:13–21 as one conversation: confession, promise, and Jesus’ prediction of his death and resurrection.',verse:'Matthew 16:18 (KJV)',reflection:'What changes when I trust Jesus to build what belongs to him?',challenge:'Read Matthew 16:13–21 and compare Matthew 16:18 with verse 21.',background:{passage:'And I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it. — Matthew 16:18 (KJV)',setting:'Jesus and the disciples were in the district of Caesarea Philippi near Mount Hermon (Matthew 16:13). The region included a sanctuary of Pan and other pagan worship traditions.',words:'Petros is Peter’s Greek name; petra means rock. Hades refers to the realm of the dead. The KJV translates it “hell,” but the imagery is more directly connected to death and its power.',audience:'Peter has just confessed Jesus as the Christ, the Son of the living God. Jesus responds with a promise about what he will build.',interpretation:'Roman Catholic teaching highlights Peter and his foundational role; many Protestant readings emphasize his confession. Other scholars see Peter and his confession together. The passage alone does not settle every later debate about church authority.',caution:'The local cave is sometimes called the “gates of Hades” in popular teaching. The historical setting is relevant, but we cannot demonstrate that Jesus identified that cave as the referent.',application:'Jesus is the builder; the power of death will not have the last word. This is not a promise of a life without hardship.'}});
const sizeKey='well-reading-scale';let readingScale=Number(localStorage.getItem(sizeKey))||1.18;function applyReadingSize(){readingScale=Math.max(1,Math.min(1.6,readingScale));document.documentElement.style.setProperty('--reading-scale',readingScale);document.getElementById('textSizeStatus').textContent=Math.round(readingScale*100)+'%';localStorage.setItem(sizeKey,String(readingScale));}document.getElementById('smallerText').onclick=()=>{readingScale=Math.round((readingScale-.1)*100)/100;applyReadingSize()};document.getElementById('largerText').onclick=()=>{readingScale=Math.round((readingScale+.1)*100)/100;applyReadingSize()};applyReadingSize();
const cats=['All','Psychology','Behind the Scripture','Faith','Personal Growth','Leadership','Relationships','Philosophy','Business','History','Science'];let current='All',view='today',query='';const $=id=>document.getElementById(id);const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let fav=get('well-favorites',[]),notes=get('well-notes',{});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dayNumber(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function todaysEntries(){const day=dayNumber();return cats.filter(c=>c!=='All').map(c=>{const group=entries.map((e,i)=>({...e,i})).filter(e=>e.cat===c);return group.length?group[((day%group.length)+group.length)%group.length]:null}).filter(Boolean)}
const firstSeenKey='well-first-seen-v3';let seen=get(firstSeenKey,{});
function markSeen(arr){let changed=false;for(const e of arr){if(!seen[e.i]){seen[e.i]=new Date().toISOString().slice(0,10);changed=true}}if(changed)put(firstSeenKey,seen)}function render(){ $('categories').innerHTML=cats.map(c=>`<button class="${current===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{current=b.dataset.cat;view='browse';render()});let arr=entries.map((e,i)=>({...e,i}));if(view==='today'){arr=todaysEntries();markSeen(arr);}else if(view==='archive')arr=arr.filter(e=>seen[e.i]);else if(view==='favorites')arr=arr.filter(e=>fav.includes(e.i));else if(view==='notes')arr=arr.filter(e=>notes[e.i]);else if(current!=='All')arr=arr.filter(e=>e.cat===current);if(query)arr=arr.filter(e=>[e.title,e.cat,e.thinker,e.book,e.idea,e.explain,e.verse].join(' ').toLowerCase().includes(query));$('count').textContent=entries.length+' readings in your library';if(view==='about'){ $('content').innerHTML=`<section class="card"><span class="pill">About The Daily Well</span><h2>Wisdom for everyday life</h2><p>The Daily Well with Pastor Ken & CJ brings together original educational summaries, thoughtful questions, biblical connections, and one practical action at a time.</p><h3>Daily readings and archive</h3><p>Each category displays one reading per day, selected automatically from the current collection. Readings repeat when a category runs out of new material. The Reading Archive shows readings you have opened in the daily selection on this device. New content requires periodic library updates.</p><h3>Privacy and saved reflections</h3><p>Notes and saved ideas are stored in this browser on this device. They are not synced to another device or backed up automatically. If you clear browser data, they may be lost. Export your journal regularly.</p><div class="actions"><button id="export">Download My Journal</button><button id="print">Print This Page</button></div><p class="hint">Book and thinker references are attributed inspiration, not direct quotations, endorsements, or full book summaries. Biblical connections invite careful reading of Scripture; not every author's ideas are identical to biblical teaching.</p><p>Presented as a prototype for possible UCF outreach. This app can be published as a public website; your journal remains local to your browser.</p></section>`;$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'The Daily Well',version:2,exported:new Date().toISOString(),favorites:fav,notes,readings:entries.map(e=>({title:e.title,category:e.cat}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='The Daily Well Journal.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('print').onclick=()=>window.print();return;}$('content').innerHTML=`<h2>${view==='today'?'Today’s Discoveries — One in Every Category':view==='archive'?'Reading Archive':view==='favorites'?'Saved Ideas':view==='notes'?'My Reflections':current==='All'?'Explore the Library':esc(current)}</h2>${arr.length?'':'<p>No entries here yet. Explore a category and save an idea or reflection.</p>'}<div class="${view==='browse'?'grid':''}">${arr.map(e=>`<article class="card"><div class="eyebrow">${esc(e.cat)}</div><h2>${esc(e.title)}</h2><small>Inspired by ${esc(e.thinker)} · ${esc(e.book)}</small>${e.background?`<h3>Scripture Reading</h3><p>${esc(e.background.passage)}</p><h3>Historical Setting</h3><p>${esc(e.background.setting)}</p><h3>Why These Words?</h3><p>${esc(e.background.words)}</p><h3>What Did the First Hearers Understand?</h3><p>${esc(e.background.audience)}</p><h3>Challenge the Interpretation</h3><p>${esc(e.background.interpretation)}</p><h3>Historical Caution</h3><p>${esc(e.background.caution)}</p><h3>Meaning for Today</h3><p>${esc(e.background.application)}</p>`:`<h3>Big Idea</h3><p>${esc(e.idea)}</p>`}${e.background?'':`<h3>Understand It</h3><p>${esc(e.explain)}</p><h3>Real-Life Example</h3><p>${esc(e.example)}</p><h3>Wisdom Meets the Word</h3><p><strong>${esc(e.verse)}</strong> — Read this passage in your Bible and consider how it relates to the idea.</p>`}<h3>Reflection</h3><p>${esc(e.reflection)}</p><h3>Today's Action</h3><p>${esc(e.challenge)}</p><label for="note${e.i}"><strong>My Notes</strong></label><textarea id="note${e.i}" placeholder="What stood out to me today?">${esc(notes[e.i]||'')}</textarea><div class="actions"><button data-save="${e.i}">Save Reflection</button><button data-fav="${e.i}">${fav.includes(e.i)?'♥ Saved':'♡ Save Idea'}</button></div></article>`).join('')}</div>`;document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let i=+b.dataset.fav;fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];put('well-favorites',fav);render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let i=+b.dataset.save;notes[i]=$('note'+i).value;put('well-notes',notes);b.textContent='Saved ✓';});} $('search').oninput=e=>{query=e.target.value.trim().toLowerCase();view='browse';render()};$('about').onclick=()=>{view='about';render()};$('today').onclick=()=>{view='today';render()};$('archive').onclick=()=>{view='archive';render()};$('favorites').onclick=()=>{view='favorites';render()};$('notes').onclick=()=>{view='notes';render()};$('theme').onclick=()=>{document.body.classList.toggle('dark');put('well-dark',document.body.classList.contains('dark'))};if(get('well-dark',false))document.body.classList.add('dark');render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
